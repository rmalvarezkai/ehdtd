[project]
name = "ehdtd"
version = "0.2.43"
description = "Ehdtd - cryptoCurrency Exchange history data to database"
authors = [
    {name = "Ricardo Marcelo Alvarez",email = "rmalvarezkai@gmail.com"}
]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/rmalvarezkai/ehdtd"
requires-python = ">=3.13,<=3.14"

dependencies = [
    "ccxt>=4.5.51",
    "ccxw>=0.2.35",
    "coincurve>=21.0.0",
    "importlib>=1.0.4",
    "logging>=0.4.9.6",
    "orjson>=3.11.8",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.1.2",
    "schedule>=1.2.2",
    "sqlalchemy>=2.0.49",
    "thread6>=0.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
